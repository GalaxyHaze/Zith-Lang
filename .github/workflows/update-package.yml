name: Repair Package Metadata

concurrency:
  group: zith-distribution-metadata
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to repair metadata for (e.g., v0.0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  update-package:
    if: >
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || true)
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid semver tag — skipping update"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release binaries
        run: |
          mkdir -p release-bins

          gh release download ${{ steps.tag.outputs.tag }} \
            --repo ${{ github.repository }} \
            --pattern "zithc-windows-amd64.exe" \
            --pattern "zithc-windows-arm64.exe" \
            --pattern "zithc-stdlib-*.zip" \
            --dir release-bins

          if [ ! -f "release-bins/zithc-windows-amd64.exe" ]; then
            echo "Failed to download zithc-windows-amd64.exe"
            exit 1
          fi

          if [ ! -f "release-bins/zithc-windows-arm64.exe" ]; then
            echo "Failed to download zithc-windows-arm64.exe"
            exit 1
          fi

          if [ ! -f "release-bins/zithc-stdlib-${{ steps.tag.outputs.tag }}.zip" ]; then
            echo "Failed to download zithc-stdlib-${{ steps.tag.outputs.tag }}.zip"
            exit 1
          fi

          ls -lh release-bins/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Update scoop manifest
        run: |
          python3 scripts/update-scoop-manifest.py \
            --manifest .github/scoop/bucket/zithc.json \
            --release-dir "$GITHUB_WORKSPACE/release-bins" \
            --repository "${{ github.repository }}" \
            --version "${{ steps.tag.outputs.version }}"
          python3 scripts/validate-release-contract.py \
            --manifest .github/scoop/bucket/zithc.json \
            --workflow-dir .github/workflows

      - name: Compute brew source SHA256
        id: brew
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output source-archive.tar.gz "$URL"
          SHA=$(sha256sum source-archive.tar.gz | cut -d' ' -f1)
          test "${#SHA}" -eq 64
          python3 scripts/update-homebrew-formula.py \
            --formula .github/homebrew/zithc.rb \
            --repository "${{ github.repository }}" \
            --version "$VERSION" \
            --sha256 "$SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Commit distribution metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/scoop/bucket/zithc.json .github/homebrew/zithc.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore: update distribution metadata to ${{ steps.tag.outputs.tag }}"
            git push
          fi

      - name: Sync Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          FORMULA_B64=$(base64 --wrap=0 .github/homebrew/zithc.rb)
          REMOTE_SHA=$(gh api \
            "repos/${{ github.repository_owner }}/homebrew-zithc/contents/Formula/zithc.rb" \
            --jq '.sha')
          test -n "$REMOTE_SHA"
          gh api --method PUT \
            "repos/${{ github.repository_owner }}/homebrew-zithc/contents/Formula/zithc.rb" \
            -f message="chore: update formula to v${{ steps.brew.outputs.version }}" \
            -f branch=main \
            -f sha="$REMOTE_SHA" \
            -f content="$FORMULA_B64" \
            --jq '.commit.sha'

      - name: Clean up
        if: always()
        run: rm -rf release-bins
