name = "zith-docs-editor"
main = "docs-editor.mjs"
compatibility_date = "2026-11-05"
workers_dev = false
routes = [
  { pattern = "docs-api.zith-lang.org", custom_domain = true }
]

[[kv_namespaces]]
binding = "DOCS_SESSIONS"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

[vars]
SITE_ORIGINS = "https://zith-lang.org,http://localhost:5501,http://127.0.0.1:5501"
